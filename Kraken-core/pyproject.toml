[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kraken"
version = "0.2.0"
description = "KRAKEN — internal engineering foundation for building OPINE (Opportunity Intelligence Engine)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "KRAKEN Contributors" }
]
keywords = ["kraken", "opine", "engineering-foundation", "internal-tooling"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Private :: Do Not Upload",
]
dependencies = [
    "typer==0.15.1",
    "rich==13.9.4",
    "loguru==0.7.3",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "black==24.10.0",
    "ruff==0.8.4",
]

[project.scripts]
kraken = "kraken.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# -----------------------------------------------------------------------------
# Black configuration
# -----------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py313"]
include = '\.pyi?$'

# -----------------------------------------------------------------------------
# Ruff configuration
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "N",   # pep8-naming
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["kraken"]

# -----------------------------------------------------------------------------
# Pytest configuration
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Ensures `kraken` is importable under the src/ layout even if the package
# has not been pip-installed yet (e.g. a fresh checkout in CI).
pythonpath = ["src"]
